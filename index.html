<!DOCTYPE html>
<html>
<head>
    <title>Penilaian Mahasiswa</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { background: white; padding: 20px; border-radius: 5px; max-width: 1000px; }
        h1 { color: #333; text-align: center; }
        .stats { margin-bottom: 20px; }
        .stat-box { display: inline-block; width: 45%; margin: 10px; padding: 15px; background: #667eea; color: white; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #333; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ddd; text-align: center; }
        tr:hover { background: #f9f9f9; }
        .lulus { color: green; font-weight: bold; }
        .tidaklulus { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistem Penilaian Mahasiswa</h1>
        
        <div class="stats">
            <div class="stat-box">Total Mahasiswa: <strong id="totalMhs">0</strong></div>
            <div class="stat-box">Rata-rata Kelas: <strong id="rataKelas">0</strong></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>MTK</th>
                    <th>Prog</th>
                    <th>DB</th>
                    <th>Web</th>
                    <th>Rata-rata</th>
                    <th>Grade</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableMahasiswa">
            </tbody>
        </table>
    </div>

    <script>
        const mahasiswa = [
            {nim: "21001", nama: "Adi Pratama", mtk: 85, prog: 90, db: 88, web: 92},
            {nim: "21002", nama: "Budi Santoso", mtk: 75, prog: 78, db: 72, web: 80},
            {nim: "21003", nama: "Citra Dewi", mtk: 92, prog: 95, db: 91, web: 94},
            {nim: "21004", nama: "Doni Hermawan", mtk: 68, prog: 65, db: 70, web: 67},
            {nim: "21005", nama: "Eva Nurul", mtk: 88, prog: 86, db: 89, web: 87}
        ];

        function hitungRataRata(mtk, prog, db, web) {
            return (mtk + prog + db + web) / 4;
        }

        function statusGrade(rataRata) {
            if (rataRata >= 80) {
                return {status: "LULUS", grade: "A", class: "lulus"};
            } else if (rataRata >= 70) {
                return {status: "LULUS", grade: "B", class: "lulus"};
            } else if (rataRata >= 60) {
                return {status: "LULUS", grade: "C", class: "lulus"};
            } else {
                return {status: "TIDAK LULUS", grade: "D", class: "tidaklulus"};
            }
        }

        let totalRata = 0;
        let html = "";
        let no = 1;

        for (let i = 0; i < mahasiswa.length; i++) {
            let m = mahasiswa[i];
            let rata = hitungRataRata(m.mtk, m.prog, m.db, m.web);
            let hasil = statusGrade(rata);
            
            totalRata += rata;

            html += "<tr>";
            html += "<td>" + no++ + "</td>";
            html += "<td>" + m.nim + "</td>";
            html += "<td>" + m.nama + "</td>";
            html += "<td>" + m.mtk + "</td>";
            html += "<td>" + m.prog + "</td>";
            html += "<td>" + m.db + "</td>";
            html += "<td>" + m.web + "</td>";
            html += "<td><strong>" + rata.toFixed(2) + "</strong></td>";
            html += "<td>" + hasil.grade + "</td>";
            html += "<td class='" + hasil.class + "'>" + hasil.status + "</td>";
            html += "</tr>";
        }

        let rataKelas = totalRata / mahasiswa.length;

        document.getElementById("tableMahasiswa").innerHTML = html;
        document.getElementById("totalMhs").textContent = mahasiswa.length;
        document.getElementById("rataKelas").textContent = rataKelas.toFixed(2);
    </script>
</body>
</html>
